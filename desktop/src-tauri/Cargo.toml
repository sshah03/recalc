[package]
name = "recalc-desktop"
version = "0.1.2"
edition = "2021"
description = "recalc — a reactive grid you and your coding agents share, as a desktop app"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
recalc = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
dirs = "6"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = "0.99"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# macOS window chrome: an empty native toolbar, so the system places the
# traffic lights (src/native.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSToolbar"] }

[[bin]]
name = "recalc"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
